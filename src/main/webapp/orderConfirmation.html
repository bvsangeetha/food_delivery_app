<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodLounge - Order Confirmed</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirmation-card {
            width: 90%;
            max-width: 520px;

            background: #ffffff;

            padding: 50px 35px;

            border-radius: 16px;

            border: 1px solid #eeeeee;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        /* Success Icon */

        .success-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 22px;

            background: #fff0eb;

            color: #ff4d2d;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
            font-weight: bold;
        }

        /* Heading */

        .confirmation-card h1 {
            font-size: 30px;

            color: #222;

            margin-bottom: 12px;
        }

        /* Message */

        .confirmation-message {
            color: #777;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 15px;
        }

        /* Delivery */

        .delivery-message {
            color: #555;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .delivery-message strong {
            color: #222;
        }

        /* Buttons */

        .button-container {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        .button {
            text-decoration: none;

            padding: 12px 25px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }

        .primary-button {
            background: #ff4d2d;

            color: white;
        }

        .primary-button:hover {
            background: #e63e20;
        }

        .secondary-button {
            background: white;

            color: #ff4d2d;

            border: 1px solid #ff4d2d;
        }

        .secondary-button:hover {
            background: #fff0eb;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .confirmation-card {
                padding: 40px 20px;
            }

            .confirmation-card h1 {
                font-size: 25px;
            }

            .button-container {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <div class="confirmation-card">

        <!-- Success Icon -->

        <div class="success-icon">
            ✓
        </div>


        <!-- Confirmation Heading -->

        <h1>
            Order Confirmed!
        </h1>


        <!-- Confirmation Message -->

        <p class="confirmation-message">

            Thank you for ordering with FoodLounge.
            Your order has been placed successfully.

        </p>


        <!-- Delivery Message -->

        <p class="delivery-message">

            Your food will be delivered in
            <strong>30–40 minutes</strong>.

        </p>


        <!-- Buttons -->

        <div class="button-container">

            <a href="#" class="button primary-button">
                View Orders
            </a>

            <a href="restaurant" class="button secondary-button">
                Continue Shopping
            </a>

        </div>

    </div>

</body>

</html>
